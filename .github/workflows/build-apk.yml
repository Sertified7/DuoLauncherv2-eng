name: Build Fold 8 APK

on:
  push:
    branches: [fold8]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        # Same key as the earlier hand-patched APKs, so this build installs over them and keeps the layout.
        run: cp signing/fold8-update.keystore "$RUNNER_TEMP/fold8.keystore"
      - name: Build release APK
        env:
          DUO_RELEASE_STORE_FILE: ${{ runner.temp }}/fold8.keystore
          DUO_RELEASE_STORE_PASSWORD: android
          DUO_RELEASE_KEY_ALIAS: androiddebugkey
          DUO_RELEASE_KEY_PASSWORD: android
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "DuoLauncher-Fold8-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: DuoLauncher-Fold8-${{ github.run_number }}
          path: DuoLauncher-Fold8-${{ github.run_number }}.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "fold8-${{ github.run_number }}" "DuoLauncher-Fold8-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" --prerelease \
            --title "Duo Launcher Fold 8 — build ${{ github.run_number }}" \
            --notes "Version compilée automatiquement depuis la branche fold8."
