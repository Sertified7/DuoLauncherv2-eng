name: Build Fold Launcher Pro APK

on:
  push:
    branches: [pli]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        env:
          PLI_STORE_FILE: ${{ github.workspace }}/signing/fold8-update.keystore
          PLI_STORE_PASSWORD: android
          PLI_KEY_ALIAS: androiddebugkey
          PLI_KEY_PASSWORD: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|Error:|What went wrong|FAILURE" -A3 build.log | head -60 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line}"
          done
          true
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "FoldLauncherPro-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: FoldLauncherPro-${{ github.run_number }}
          path: FoldLauncherPro-${{ github.run_number }}.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "pli-${{ github.run_number }}" "FoldLauncherPro-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" --prerelease \
            --title "Fold Launcher Pro — build ${{ github.run_number }}" \
            --notes "Fold Launcher Pro compilé automatiquement depuis la branche pli."
